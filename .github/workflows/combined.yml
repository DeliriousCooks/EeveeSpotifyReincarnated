      - name: Build spoti.pw IPA
        shell: bash
        run: |
          set -euo pipefail

          SPOTI_DIR="${RUNNER_TEMP}/spoti.pw"

          mkdir -p "${SPOTI_DIR}/ipa"

          cp \
            "${{ github.workspace }}/spotify.ipa" \
            "${SPOTI_DIR}/ipa/spotify.ipa"

          cd "${SPOTI_DIR}"

          make release

          SPOTI_IPA_REL="$(
            find out \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -1
          )"

          if [ -z "${SPOTI_IPA_REL}" ]; then
            echo "::error::spoti.pw did not produce an IPA."
            exit 1
          fi

          # Convert the relative path into an absolute path.
          SPOTI_IPA="${SPOTI_DIR}/${SPOTI_IPA_REL#./}"

          if [ ! -f "${SPOTI_IPA}" ]; then
            echo "::error::spoti.pw IPA does not exist:"
            echo "${SPOTI_IPA}"
            exit 1
          fi

          echo "SPOTI_IPA=${SPOTI_IPA}" >> "$GITHUB_ENV"

          echo "spoti.pw IPA:"
          ls -lh "${SPOTI_IPA}"
