name: Combined - spoti.pw + EeveeSpotify

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to decrypted Spotify 9.1.78 IPA"
        required: true
        type: string

      eevee_ref:
        description: "Eevee branch/tag/commit"
        required: true
        default: "Master"
        type: string

      upload_method:
        description: "Where to put the resulting IPA"
        required: true
        default: "artifacts"
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout Eevee
      # ============================================================

      - name: Checkout EeveeSpotify
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.eevee_ref }}
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # 2. Xcode
      # ============================================================

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      # ============================================================
      # 3. Theos
      # ============================================================

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      # ============================================================
      # 4. Build tools
      # ============================================================

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget

          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

          python3 -m pip install \
            --break-system-packages \
            --upgrade \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

          ARCH=$(uname -m)

          if [ "$ARCH" = "x86_64" ]; then
            SUFFIX=macos-amd64
          else
            SUFFIX=macos-arm64
          fi

          sudo curl -fsSL \
            "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
            -o /usr/local/bin/ipapatch

          sudo chmod +x /usr/local/bin/ipapatch

          ipapatch --help >/dev/null

      # ============================================================
      # 5. Download decrypted Spotify IPA
      # ============================================================

      - name: Download Spotify IPA
        run: |
          wget "${{ inputs.ipa_url }}" \
            --no-verbose \
            -O "${{ github.workspace }}/spotify.ipa"

          file_type=$(file --mime-type -b "${{ github.workspace }}/spotify.ipa")

          if [[ "$file_type" != "application/x-ios-app" &&
                "$file_type" != "application/zip" ]]; then
            echo "::error::Downloaded file is not an IPA: $file_type"
            exit 1
          fi

          echo "Downloaded IPA:"
          ls -lh "${{ github.workspace }}/spotify.ipa"

      # ============================================================
      # 6. Verify Spotify version
      # ============================================================

      - name: Check Spotify version
        run: |
          unzip -p "${{ github.workspace }}/spotify.ipa" \
            'Payload/Spotify.app/Info.plist' \
            > "${RUNNER_TEMP}/Spotify-Info.plist"

          SPOTIFY_VERSION=$(
            plutil \
              -extract CFBundleShortVersionString raw \
              "${RUNNER_TEMP}/Spotify-Info.plist"
          )

          echo "Spotify version: ${SPOTIFY_VERSION}"

          if [ "$SPOTIFY_VERSION" != "9.1.78" ]; then
            echo "::error::This build is intended for Spotify 9.1.78."
            echo "::error::Found Spotify ${SPOTIFY_VERSION} instead."
            exit 1
          fi

      # ============================================================
      # 7. Clone spoti.pw v0.21.1
      # ============================================================

      - name: Checkout spoti.pw v0.21.1
        run: |
          git clone \
            --depth 1 \
            --branch v0.21.1 \
            https://github.com/skopevoj/spoti.pw.git \
            "${RUNNER_TEMP}/spoti.pw"

          cd "${RUNNER_TEMP}/spoti.pw"

          echo "spoti.pw commit:"
          git rev-parse HEAD

          echo "spoti.pw version:"
          cat version.txt

      # ============================================================
      # 8. Build spoti.pw
      # ============================================================

      - name: Build spoti.pw
        run: |
          cd "${RUNNER_TEMP}/spoti.pw"

          mkdir -p ipa

          cp "${github.workspace}/spotify.ipa" \
             ipa/spotify.ipa

          make release

          SPOTI_IPA=$(find out -maxdepth 1 -name '*.ipa' | head -1)

          if [ -z "$SPOTI_IPA" ]; then
            echo "::error::spoti.pw IPA was not produced."
            exit 1
          fi

          echo "SPOTI_IPA=$SPOTI_IPA" >> "$GITHUB_ENV"

          echo "Built spoti.pw:"
          ls -lh "$SPOTI_IPA"

      # ============================================================
      # 9. Build EeveeSwiftProtobuf
      # ============================================================

      - name: Build EeveeSwiftProtobuf
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      # ============================================================
      # 10. Build Eevee .deb
      # ============================================================

      - name: Build Eevee .deb
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless \
            make package FINALPACKAGE=1

          DEB_PATH=$(
            find packages \
              -name "com.eevee.spotify_*.deb" \
              | head -1
          )

          if [ -z "$DEB_PATH" ]; then
            echo "::error::Eevee .deb was not produced."
            exit 1
          fi

          echo "DEB_PATH=$DEB_PATH" >> "$GITHUB_ENV"

          echo "Built Eevee:"
          ls -lh "$DEB_PATH"

      # ============================================================
      # 11. Extract Eevee package
      # ============================================================

      - name: Extract Eevee package
        run: |
          DEB_EXTRACT="${RUNNER_TEMP}/eevee-deb"

          rm -rf "$DEB_EXTRACT"
          mkdir -p "$DEB_EXTRACT"

          dpkg-deb \
            -R "$DEB_PATH" \
            "$DEB_EXTRACT"

          DYLIB_SRC=$(
            find "$DEB_EXTRACT" \
              -name 'EeveeSpotify.dylib' \
              | head -1
          )

          BUNDLE_SRC=$(
            find "$DEB_EXTRACT" \
              -type d \
              -name 'EeveeSpotify.bundle' \
              | head -1
          )

          FRAMEWORK_SRC=$(
            find "$DEB_EXTRACT" \
              -type d \
              -name 'EeveeSwiftProtobuf.framework' \
              | head -1
          )

          if [ -z "$DYLIB_SRC" ]; then
            echo "::error::EeveeSpotify.dylib not found."
            exit 1
          fi

          echo "DYLIB_SRC=$DYLIB_SRC" >> "$GITHUB_ENV"

          if [ -n "$BUNDLE_SRC" ]; then
            echo "BUNDLE_SRC=$BUNDLE_SRC" >> "$GITHUB_ENV"
          fi

          if [ -n "$FRAMEWORK_SRC" ]; then
            echo "FRAMEWORK_SRC=$FRAMEWORK_SRC" >> "$GITHUB_ENV"
          fi

          echo "Eevee dylib:"
          echo "$DYLIB_SRC"

          echo "Eevee bundle:"
          echo "${BUNDLE_SRC:-none}"

          echo "Eevee framework:"
          echo "${FRAMEWORK_SRC:-none}"

      # ============================================================
      # 12. Inject Eevee into the spoti.pw IPA
      # ============================================================

      - name: Inject Eevee into spoti.pw IPA
        run: |
          mkdir -p Outputs/IPAS

          SPOT_VERSION=$(
            unzip -p "${github.workspace}/spotify.ipa" \
              'Payload/Spotify.app/Info.plist' |
            plutil \
              -extract CFBundleShortVersionString raw \
              -
          )

          EEVEE_VERSION=$(
            grep -E '^Version:' control |
            awk '{print $2}'
          )

          OUT="Outputs/IPAS/Spotify-Combined-${SPOT_VERSION}.ipa"

          INJECT=(
            "$DYLIB_SRC"
          )

          if [ -n "${FRAMEWORK_SRC:-}" ]; then
            INJECT+=(
              "$FRAMEWORK_SRC"
            )
          fi

          if [ -n "${BUNDLE_SRC:-}" ]; then
            INJECT+=(
              "$BUNDLE_SRC"
            )
          fi

          echo "Injecting Eevee into:"
          echo "$SPOTI_IPA"

          echo "Final IPA:"
          echo "$OUT"

          cyan \
            -i "$SPOTI_IPA" \
            -o "$OUT" \
            -f "${INJECT[@]}" \
            -c 9 \
            -m 15.0 \
            -du

          echo "OUT_IPA=$OUT" >> "$GITHUB_ENV"

          ls -lh "$OUT"

      # ============================================================
      # 13. Build zxPluginsInject
      # ============================================================

      - name: Build zxPluginsInject
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      # ============================================================
      # 14. Inject sideload compatibility layer
      # ============================================================

      - name: Inject zxPluginsInject
        run: |
          ipapatch \
            --input "$OUT_IPA" \
            --inplace \
            --noconfirm \
            --dylib packages/zxPluginsInject.dylib

      # ============================================================
      # 15. Verify final IPA
      # ============================================================

      - name: Inspect final IPA
        run: |
          echo "Final IPA:"
          ls -lh "$OUT_IPA"

          echo
          echo "Injected files:"
          unzip -l "$OUT_IPA" |
            grep -E \
              'spotifyglass|EeveeSpotify|EeveeSwiftProtobuf|SpotifyGlass' \
              || true

      # ============================================================
      # 16. Upload artifact
      # ============================================================

      - name: Upload combined IPA
        if: inputs.upload_method != 'filebin'
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-Combined-spoti-pw-Eevee
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      # ============================================================
      # 17. Optional filebin upload
      # ============================================================

      - name: Upload to filebin
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotify-combined-${{ github.run_id }}"

          FILENAME=$(basename "$OUT_IPA")

          curl -fsS \
            -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${OUT_IPA}" \
            "https://filebin.net/${BIN}/${FILENAME}" \
            >/dev/null

          echo "Download:"
          echo "https://filebin.net/${BIN}/${FILENAME}"
