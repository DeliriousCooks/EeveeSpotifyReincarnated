name: Combined spoti.pw + EeveeSpotify

on:
  workflow_dispatch:
    inputs:
      eevee_ref:
        description: "Eevee branch/tag/commit"
        default: "Master"
        required: true
        type: string
      ipa_url:
        description: "Direct URL to a decrypted Spotify 9.1.78 IPA"
        required: true
        type: string
      upload_method:
        description: "Where to upload the final IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout EeveeSpotify
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.eevee_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          brew install make dpkg ldid wget

          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

          python3 -m pip install \
            --upgrade \
            --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

          ARCH="$(uname -m)"
          if [ "$ARCH" = "x86_64" ]; then
            SUFFIX="macos-amd64"
          else
            SUFFIX="macos-arm64"
          fi

          sudo curl -fsSL \
            "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
            -o /usr/local/bin/ipapatch

          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework
        shell: bash
        run: |
          set -euo pipefail

          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build Eevee .deb
        shell: bash
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail

          THEOS_PACKAGE_SCHEME=rootless \
            make package FINALPACKAGE=1

          DEB_PATH="$(
            find packages \
              -type f \
              -name 'com.eevee.spotify_*.deb' \
              -print \
              | head -n 1
          )"

          if [ -z "$DEB_PATH" ]; then
            echo "::error::Eevee .deb was not produced."
            exit 1
          fi

          echo "DEB_PATH=$DEB_PATH" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> "$GITHUB_ENV"

          ls -lh "$DEB_PATH"

      - name: Upload Eevee .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      - name: Download decrypted Spotify IPA
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "${{ inputs.ipa_url }}" \
            -o "${{ github.workspace }}/spotify.ipa"

          FILE_TYPE="$(file --mime-type -b "${{ github.workspace }}/spotify.ipa")"

          if [[ "$FILE_TYPE" != "application/x-ios-app" && "$FILE_TYPE" != "application/zip" ]]; then
            echo "::error::Downloaded file is not a valid IPA: $FILE_TYPE"
            exit 1
          fi

          ls -lh "${{ github.workspace }}/spotify.ipa"

      - name: Verify Spotify 9.1.78
        shell: bash
        run: |
          set -euo pipefail

          unzip -p \
            "${{ github.workspace }}/spotify.ipa" \
            'Payload/*.app/Info.plist' \
            > "${RUNNER_TEMP}/Spotify-Info.plist"

          SPOTIFY_VERSION="$(
            plutil \
              -extract CFBundleShortVersionString raw \
              "${RUNNER_TEMP}/Spotify-Info.plist"
          )"

          echo "Spotify version: ${SPOTIFY_VERSION}"

          if [ "$SPOTIFY_VERSION" != "9.1.78" ]; then
            echo "::error::This combined workflow is pinned to Spotify 9.1.78."
            exit 1
          fi

      - name: Checkout spoti.pw v0.21.1
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch v0.21.1 \
            https://github.com/skopevoj/spoti.pw.git \
            "${RUNNER_TEMP}/spoti.pw"

          cd "${RUNNER_TEMP}/spoti.pw"

          echo "spoti.pw commit:"
          git rev-parse HEAD

      - name: Build spoti.pw IPA
        shell: bash
        run: |
          set -euo pipefail

          SPOTI_DIR="${RUNNER_TEMP}/spoti.pw"
          SPOTI_OUTPUT="${RUNNER_TEMP}/spoti-final.ipa"

          mkdir -p "${SPOTI_DIR}/ipa"

          cp \
            "${{ github.workspace }}/spotify.ipa" \
            "${SPOTI_DIR}/ipa/spotify.ipa"

          cd "${SPOTI_DIR}"

          make release

          echo "spoti.pw output candidates:"
          find "${SPOTI_DIR}/out" \
            -maxdepth 1 \
            -type f \
            -name '*.ipa' \
            -print

          SPOTI_BUILT="$(
            find "${SPOTI_DIR}/out" \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -n 1
          )"

          if [ -z "$SPOTI_BUILT" ]; then
            echo "::error::spoti.pw did not produce an IPA."
            exit 1
          fi

          echo "spoti.pw produced:"
          echo "$SPOTI_BUILT"

          cp "$SPOTI_BUILT" "$SPOTI_OUTPUT"

          if [ ! -f "$SPOTI_OUTPUT" ]; then
            echo "::error::Failed to create absolute-path spoti.pw IPA."
            exit 1
          fi

          echo "Final spoti.pw IPA:"
          ls -lh "$SPOTI_OUTPUT"

          # Deliberately write an absolute path.
          echo "SPOTI_IPA=$SPOTI_OUTPUT" >> "$GITHUB_ENV"

      - name: Build zxPluginsInject.dylib
        shell: bash
        run: |
          set -euo pipefail

          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

          if [ ! -f packages/zxPluginsInject.dylib ]; then
            echo "::error::zxPluginsInject.dylib was not produced."
            exit 1
          fi

      - name: Extract Eevee components
        shell: bash
        run: |
          set -euo pipefail

          DEB_EXTRACT="${RUNNER_TEMP}/eevee-deb"

          rm -rf "$DEB_EXTRACT"
          mkdir -p "$DEB_EXTRACT"

          dpkg-deb \
            -R \
            "$DEB_PATH" \
            "$DEB_EXTRACT"

          DYLIB_SRC="$(
            find "$DEB_EXTRACT" \
              -type f \
              -name 'EeveeSpotify.dylib' \
              -print \
              | head -n 1
          )"

          BUNDLE_SRC="$(
            find "$DEB_EXTRACT" \
              -type d \
              -name 'EeveeSpotify.bundle' \
              -print \
              | head -n 1
          )"

          FRAMEWORK_SRC="$(
            find "$DEB_EXTRACT" \
              -type d \
              -name 'EeveeSwiftProtobuf.framework' \
              -print \
              | head -n 1
          )"

          if [ -z "$DYLIB_SRC" ]; then
            echo "::error::EeveeSpotify.dylib was not found in the .deb."
            exit 1
          fi

          echo "DYLIB_SRC=$DYLIB_SRC" >> "$GITHUB_ENV"

          if [ -n "$BUNDLE_SRC" ]; then
            echo "BUNDLE_SRC=$BUNDLE_SRC" >> "$GITHUB_ENV"
          fi

          if [ -n "$FRAMEWORK_SRC" ]; then
            echo "FRAMEWORK_SRC=$FRAMEWORK_SRC" >> "$GITHUB_ENV"
          fi

          echo "Eevee dylib: $DYLIB_SRC"
          echo "Eevee bundle: ${BUNDLE_SRC:-none}"
          echo "Eevee framework: ${FRAMEWORK_SRC:-none}"

      - name: Inject Eevee into spoti.pw IPA
        shell: bash
        run: |
          set -euo pipefail

          # Use the absolute path created by the previous step.
          SPOTI_INPUT="${SPOTI_IPA}"

          if [ ! -f "$SPOTI_INPUT" ]; then
            echo "::error::spoti.pw IPA does not exist:"
            echo "$SPOTI_INPUT"
            echo
            echo "IPA files currently under RUNNER_TEMP:"
            find "$RUNNER_TEMP" -type f -name '*.ipa' -print
            exit 1
          fi

          mkdir -p "${{ github.workspace }}/Outputs/IPAS"

          SPOTIFY_VERSION="$(
            unzip -p \
              "${{ github.workspace }}/spotify.ipa" \
              'Payload/*.app/Info.plist' |
            plutil \
              -extract CFBundleShortVersionString raw -
          )"

          EEVEE_VERSION="$(
            grep -E '^Version:' control |
            awk '{print $2}'
          )"

          OUT_IPA="${{ github.workspace }}/Outputs/IPAS/Spotify-${SPOTIFY_VERSION}-spoti-Eevee-${EEVEE_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")

          if [ -n "${FRAMEWORK_SRC:-}" ]; then
            INJECT+=("$FRAMEWORK_SRC")
          fi

          if [ -n "${BUNDLE_SRC:-}" ]; then
            INJECT+=("$BUNDLE_SRC")
          fi

          echo "Input:"
          echo "$SPOTI_INPUT"

          echo
          echo "Injecting:"
          printf '  %s\n' "${INJECT[@]}"

          echo
          echo "Output:"
          echo "$OUT_IPA"

          cyan \
            -i "$SPOTI_INPUT" \
            -o "$OUT_IPA" \
            -f "${INJECT[@]}" \
            -c 9 \
            -m 15.0 \
            -du

          if [ ! -f "$OUT_IPA" ]; then
            echo "::error::cyan did not produce the final IPA."
            exit 1
          fi

          echo "OUT_IPA=$OUT_IPA" >> "$GITHUB_ENV"

          ls -lh "$OUT_IPA"

      - name: LC-inject zxPluginsInject
        shell: bash
        run: |
          set -euo pipefail

          ipapatch \
            --input "$OUT_IPA" \
            --inplace \
            --noconfirm \
            --dylib packages/zxPluginsInject.dylib

      - name: Verify final IPA
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$OUT_IPA" ]; then
            echo "::error::Final IPA does not exist."
            exit 1
          fi

          echo "Final IPA:"
          ls -lh "$OUT_IPA"

          echo
          echo "Injected components found in final IPA:"

          unzip -l "$OUT_IPA" |
            grep -E \
              'spotifyglass|SpotifyGlass|EeveeSpotify|EeveeSwiftProtobuf|zxPluginsInject' \
            || true

      - name: Upload final IPA artifact
        if: ${{ inputs.upload_method == 'artifacts' || inputs.upload_method == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-spoti-pw-Eevee
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload final IPA to filebin.net
        if: ${{ inputs.upload_method == 'filebin' || inputs.upload_method == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          BIN="spotify-combined-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME="$(basename "$OUT_IPA")"

          curl -fsS \
            -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${OUT_IPA}" \
            "https://filebin.net/${BIN}/${FILENAME}" \
            >/dev/null

          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"

          echo "Uploaded to: ${DOWNLOAD_URL}"

          {
            echo "### Combined IPA"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
