      - name: Build spoti.pw IPA
        shell: bash
        run: |
          set -euo pipefail

          SPOTI_DIR="${RUNNER_TEMP}/spoti.pw"
          SPOTI_OUTPUT="${RUNNER_TEMP}/spoti-final.ipa"

          mkdir -p "${SPOTI_DIR}/ipa"

          cp \
            "${{ github.workspace }}/spotify.ipa" \
            "${SPOTI_DIR}/ipa/spotify.ipa"

          cd "${SPOTI_DIR}"

          make release

          echo "Looking for spoti.pw output..."

          find "${SPOTI_DIR}/out" \
            -maxdepth 1 \
            -type f \
            -name '*.ipa' \
            -print

          SPOTI_BUILT="$(
            find "${SPOTI_DIR}/out" \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              | head -n 1
          )"

          if [ -z "${SPOTI_BUILT}" ]; then
            echo "::error::spoti.pw did not produce an IPA."
            exit 1
          fi

          echo "spoti.pw produced:"
          echo "${SPOTI_BUILT}"

          # Copy it to a guaranteed absolute path.
          cp \
            "${SPOTI_BUILT}" \
            "${SPOTI_OUTPUT}"

          if [ ! -f "${SPOTI_OUTPUT}" ]; then
            echo "::error::Failed to copy spoti.pw IPA."
            exit 1
          fi

          echo "SPOTI_IPA=${SPOTI_OUTPUT}" >> "$GITHUB_ENV"

          echo "Final spoti.pw input for cyan:"
          ls -lh "${SPOTI_OUTPUT}"
